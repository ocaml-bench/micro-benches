# Build scripts in the tree that no program runs; listed so `check` does not flag them.
disabled:
  contrast:
    path: with_packages/sauvola
    build_script: contrast.build.sh
    reason: >-
      camlimages 5.0.5 fails to build on OCaml >= 5.4 (`/usr/bin/ld: final link
      failed: bad value`), verified on 5.5.0 and trunk c0f8c8ce on 2026-08-10.
      Source kept; re-enable when a camlimages that links is available.
  mandelbrot6_multicore:
    path: multicore/multicore-numerical
    build_script: mandelbrot6_multicore.build.sh
    reason: >-
      OxCaml type error (output_bytes wants `bytes @ local`, Array.iter does
      not); builds under stock OCaml but the sweep runs both, so it stays out.
  chameneos_redux_lwt:
    path: with_packages/chameneos
    build_script: chameneos_redux_lwt.build.sh
    reason: >-
      lwt_unix does not compile under OxCaml (`bytes @ local` in Unix.recv).
  thread_ring_lwt_mvar:
    path: with_packages/thread-lwt
    build_script: thread_ring_lwt_mvar.build.sh
    reason: same lwt_unix/OxCaml locality error as chameneos_redux_lwt.
  thread_ring_lwt_stream:
    path: with_packages/thread-lwt
    build_script: thread_ring_lwt_stream.build.sh
    reason: same lwt_unix/OxCaml locality error as chameneos_redux_lwt.
