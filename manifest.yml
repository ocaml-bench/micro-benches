# manifest.yml: the programs this tree can build and run. `make check`
# validates it against the tree; scripts/ci-build-all.sh, ci-run-all.sh and
# test-runtimes.sh read it.
#
# `args` are copied verbatim from running-ng's micro_base.yml so the two can be
# diffed (`make check-running-ng`); ${RUNNING_BENCH_DIR} is the root of this repo.
# `build_script` defaults to <name>.build.sh.
# `inputs_generated: true`: the input is produced by a <name>.build.deps.sh in
# the program's directory rather than committed, so `check` does not require it.
# `disabled`: build scripts in the tree that no program runs.
# `broken_from: "X.Y"`: CI skips the program on OCaml X.Y and later (an
# upstream break, named in a comment, that this repo cannot patch).

default_timeout: 120

suites:
  sandmark-sequential:
    type: OCamlBenchmarkSuite
    timeout: 120
  sandmark-with-deps:
    type: OCamlBenchmarkSuite
    timeout: 300
  sandmark-with-packages:
    type: OCamlBenchmarkSuite
    timeout: 120
  multicore-effects:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
  multicore-structures:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
  multicore-numerical:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 180
  multicore-grammatrix:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
  multicore-minilight:
    type: OCamlMulticoreBenchmarkSuite
    # 4 domains: on a 3-core macOS runner it takes 133 s (30 s with 3).
    timeout: 300
  graph500par:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 300
  mpl:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 300
  multicore-simple-tests:
    type: OCamlMulticoreBenchmarkSuite
    timeout: 120
  multicore-gcroots:
    type: OCamlMulticoreBenchmarkSuite
    # 4 domains and a stop-the-world full major every 37 steps: on a 3-core
    # macOS runner globroots_sp takes about 120 s (2 s on an Apple M5).
    timeout: 300
  oxcaml-prefetch:
    type: OCamlOxcamlBenchmarkSuite
    timeout: 30

